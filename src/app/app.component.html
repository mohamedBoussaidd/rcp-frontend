@if (bandeauSimulation()) {
  <div class="bandeau-simulation" role="status">
    <span class="bandeau-simulation__txt">🕓 Vue au {{ dateSimulee() | date:'dd/MM/yyyy' }} — lecture seule (voyage dans la saison)</span>
    <button type="button" class="bandeau-simulation__quit" (click)="quitterSimulation()">Quitter</button>
  </div>
}

@if (auth.currentUser() && !modeMobile()) {
  <div class="app-shell">
    <app-nav-sidebar></app-nav-sidebar>
    <main class="app-main">
      <router-outlet></router-outlet>
    </main>
  </div>
} @else {
  <router-outlet></router-outlet>
}

@if (auth.currentUser()) {
  <!-- Bulles flottantes, empilées verticalement dans le coin bas-droit par défaut et DÉPLAÇABLES
       (position mémorisée par bulle dans le navigateur, via `appBulleFlottante`). -->
  <!-- En PWA, la cloche est intégrée dans l'en-tête joueur (mode inline) ; ici uniquement en desktop. -->
  @if (!modeMobile()) {
    <app-notification-bell appBulleFlottante="notifications"
                           [positionDefaut]="{ droite: 18, bas: 142 }"></app-notification-bell>
  }
  <app-chat-widget appBulleFlottante="messagerie"
                   [positionDefaut]="{ droite: 18, bas: 18 }"></app-chat-widget>
  <app-assistant-widget appBulleFlottante="assistant"
                        [positionDefaut]="{ droite: 18, bas: 80 }"></app-assistant-widget>
}
