@if (saisonVisible) {
  <!-- En archive, la pill vire à l'ambre : toutes les listes sont bornées sur une saison passée,
       ça doit se voir en permanence et pas seulement au moment où on la choisit. -->
  <button class="context-pill context-pill--saison"
          [class.context-pill--archive]="saison.estArchive()"
          (click)="changerSaison()"
          [title]="saison.estArchive() ? 'Saison passée consultée — cliquer pour changer de saison' : 'Changer de saison'">
    <mat-icon class="context-pill__chev">{{ saison.estArchive() ? 'history' : 'event' }}</mat-icon>
    <span class="context-pill__content">
      <span class="context-pill__label">{{ saison.estArchive() ? 'Saison passée' : 'Saison' }}</span>
      <span class="context-pill__value">{{ saison.saisonActive()!.libelle }}</span>
    </span>
    <mat-icon class="context-pill__chev">expand_more</mat-icon>
  </button>

  @if (saison.estArchive()) {
    <button class="context-pill context-pill--retour"
            (click)="revenirSaisonEnCours()"
            title="Revenir à la saison en cours">
      <mat-icon class="context-pill__chev">undo</mat-icon>
      <span class="context-pill__value">Saison en cours</span>
    </button>
  }
}

@if (visible) {
  <button class="context-pill" (click)="estSuperAdmin && retourAdmin()" [title]="estSuperAdmin ? 'Retour administration' : 'Club actif'">
    <span class="context-pill__crest">{{ contexte.clubActif()!.nom.substring(0, 3).toUpperCase() }}</span>
    <span class="context-pill__content">
      <span class="context-pill__label">Club</span>
      <span class="context-pill__value">{{ contexte.clubActif()!.nom }}</span>
    </span>
    <mat-icon class="context-pill__chev">expand_more</mat-icon>
  </button>

  <div class="context-pill">
    <span class="context-pill__content">
      <span class="context-pill__label">Équipe</span>
      @if (contexte.equipesDispo().length > 0) {
        <select class="context-pill__select"
                [value]="contexte.equipesActives().length ? contexte.equipesActives()[0] : ''"
                (change)="onChangerEquipe($any($event.target).value)">
          <option value="">Toutes les équipes</option>
          @for (e of contexte.equipesDispo(); track e.id) {
            <option [value]="e.id">{{ e.nom }}</option>
          }
        </select>
      } @else {
        <span class="context-pill__value">{{ contexte.libelleEquipe() }}</span>
      }
    </span>
  </div>
}

<!-- Staff multi-équipes : bascule entre les équipes de ses affectations (pas de pill club). -->
@if (selecteurStaffVisible) {
  <div class="context-pill">
    <span class="context-pill__content">
      <span class="context-pill__label">Équipe</span>
      <select class="context-pill__select"
              [value]="contexte.equipesActives().length ? contexte.equipesActives()[0] : ''"
              (change)="onChangerEquipe($any($event.target).value)">
        <option value="">Toutes mes équipes</option>
        @for (e of contexte.equipesDispo(); track e.id) {
          <option [value]="e.id">{{ e.nom }}</option>
        }
      </select>
    </span>
  </div>
}
